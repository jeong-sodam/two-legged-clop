<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#161124" />
    <title>두 발 클롭</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="game-shell">
      <h1 class="visually-hidden">두 발 클롭</h1>
      <canvas id="game" width="960" height="540" aria-label="두 발 클롭 게임"></canvas>
      <section class="keyboard-help" aria-label="키보드 조작 안내">
        <p><strong>다리 균형</strong> <kbd>←</kbd> 오른발 들기 <kbd>→</kbd> 오른발 내리기</p>
        <p><kbd>↑</kbd> 왼발 내리기 <kbd>↓</kbd> 왼발 들기</p>
        <p><strong>이동</strong> <kbd>A</kbd> / <kbd>D</kbd> 좌우 이동 <kbd>W</kbd> 점프 <kbd>S</kbd> 숙이기</p>
        <p><strong>시작</strong> <kbd>Enter</kbd> / <kbd>Space</kbd></p>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
